<html lang="ko">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <title>멋쟁이 사자들</title>
</head>

<body>

    <div class="control-panel">
        <button id="btn-add">아기 사자 추가</button>
        <button id="btn-delete">마지막 아기 사자 삭제</button>
        <span id="total-count">총 0명</span>
    </div>
    <div class="api-control-section">
        <button type="button" id="btn-random-1">랜덤 1명 추가</button>
        <button type="button" id="btn-random-5">랜덤 5명 추가</button>
        <button type="button" id="btn-refresh-all">전체 새로고침</button>
        <span id="status-message" class="status-ready">준비 완료</span>
    </div>

    <div class="filter-section">
        <div class="filter-group">
            <label for="filter-job">파트</label>
            <select id="filter-job">
                <option value="전체">전체</option>
                <option value="Frontend">Frontend</option>
                <option value="Backend">Backend</option>
                <option value="Design">Design</option>
            </select>
        </div>

        <div class="filter-group">
            <label for="sort-type">정렬</label>
            <select id="sort-type">
                <option value="최신추가순">최신추가순</option>
                <option value="이름순">이름순</option>
            </select>
        </div>

        <div class="filter-group">
            <label for="search-name">검색</label>
            <input type="text" id="search-name" placeholder="이름으로 검색" />
        </div>
    </div>

    <div id="content-form">
        <form id="card-form">
            <div class="form-row">
                <div class="form-group flex-1">
                    <label for="card-name">이름</label>
                    <input type="text" id="card-name" name="name" placeholder="예: 홍길동" required />
                </div>
                <div class="form-group flex-1">
                    <label for="job-select">파트</label>
                    <select id="job-select" name="job" required>
                        <option value="Frontend">Frontend</option>
                        <option value="Backend">Backend</option>
                        <option value="Design">Design</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label for="input-skills">관심 기술 (쉼표로 구분)</label>
                <input type="text" id="input-skills" name="skills" placeholder="예: JavaScript, React, HTML/CSS"
                    required />
            </div>

            <div class="form-group">
                <label for="input-summary">한 줄 소개 (요약 카드)</label>
                <input type="text" id="input-summary" name="summary" placeholder="예: 3주차 DOM 조작 연습 중!" required />
            </div>

            <div class="form-group">
                <label for="input-intro">자기소개 (상세 카드)</label>
                <textarea id="input-intro" name="intro" rows="4" placeholder="예: HTML/CSS로 구조를 만들고..."
                    required></textarea>
            </div>

            <div class="form-row">
                <div class="form-group flex-1">
                    <label for="input-email">Email</label>
                    <input type="email" id="input-email" name="email" placeholder="예: lion@example.com" required />
                </div>
                <div class="form-group flex-1">
                    <label for="input-phonenum">Phone</label>
                    <input type="tel" id="input-phonenum" name="phone" placeholder="예: 010-1234-5678" required />
                </div>
            </div>

            <div class="form-group">
                <label for="input-website">Website</label>
                <input type="url" id="input-website" name="web" placeholder="예: https://example.com" required />
            </div>

            <div class="form-group">
                <label for="input-talk">한 마디</label>
                <input type="text" id="input-talk" name="talk" placeholder="예: 데이터 바꾸면 화면도 바뀐다!" required />
            </div>

            <div class="form-buttons">
                <button type="button" id="btn-auto-fill">랜덤 값 채우기</button>
                <button type="submit" id="btn-sumit">추가하기</button>
                <button type="button" id="btn-back">취소</button>
            </div>
        </form>
    </div>

    <div id="card-container"> </div>

    <div id="summary-container"></div>

    <script src="script.js"></script>
</body>

</html>
